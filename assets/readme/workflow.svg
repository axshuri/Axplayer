<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">How Axplayer works</title>
  <desc id="desc">A flow diagram from the station catalog and selected stream URL to LibVLC playback, ICY metadata, reconnect handling, and raw recording.</desc>
  <rect width="1200" height="420" rx="24" fill="#101418"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="58" y="58" fill="#f5f7f9" font-size="32" font-weight="700">One stream, several useful paths</text>
    <text x="60" y="88" fill="#9daab2" font-size="18">Axplayer keeps playback, metadata, recovery, and recording independent.</text>
  </g>
  <g fill="none" stroke="#50616b" stroke-width="3">
    <path d="M248 181H330"/><path d="M550 181H632"/><path d="M852 181H934"/>
    <path d="M702 220V305H930"/><path d="M702 220V305H470"/>
  </g>
  <g fill="#50616b">
    <path d="m330 181-12-8v16z"/><path d="m632 181-12-8v16z"/><path d="m934 181-12-8v16z"/>
    <path d="m930 305-12-8v16z"/><path d="m470 305-12-8v16z"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <g transform="translate(58 130)">
      <rect width="190" height="102" rx="12" fill="#202a30" stroke="#3d4c55"/>
      <text x="18" y="31" fill="#61afef" font-size="16">01 / CATALOG</text>
      <text x="18" y="60" fill="#f5f7f9" font-size="19">fmstream.org</text>
      <text x="18" y="84" fill="#aab5bb" font-size="16">cached locally</text>
    </g>
    <g transform="translate(330 130)">
      <rect width="220" height="102" rx="12" fill="#202a30" stroke="#3d4c55"/>
      <text x="18" y="31" fill="#61afef" font-size="16">02 / SELECT</text>
      <text x="18" y="60" fill="#f5f7f9" font-size="19">station URL</text>
      <text x="18" y="84" fill="#aab5bb" font-size="16">favorites + search</text>
    </g>
    <g transform="translate(632 130)">
      <rect width="220" height="102" rx="12" fill="#202a30" stroke="#3d4c55"/>
      <text x="18" y="31" fill="#61afef" font-size="16">03 / PLAY</text>
      <text x="18" y="60" fill="#f5f7f9" font-size="19">LibVLC</text>
      <text x="18" y="84" fill="#aab5bb" font-size="16">MP3 • AAC • OGG</text>
    </g>
    <g transform="translate(934 130)">
      <rect width="208" height="102" rx="12" fill="#202a30" stroke="#3d4c55"/>
      <text x="18" y="31" fill="#61afef" font-size="16">04 / RENDER</text>
      <text x="18" y="60" fill="#f5f7f9" font-size="19">terminal UI</text>
      <text x="18" y="84" fill="#aab5bb" font-size="16">status + spectrum</text>
    </g>
    <g transform="translate(320 305)">
      <rect width="300" height="70" rx="12" fill="#18251d" stroke="#98c379"/>
      <text x="18" y="30" fill="#98c379" font-size="16">LIVE METADATA</text>
      <text x="18" y="56" fill="#f5f7f9" font-size="18">ICY StreamTitle → history</text>
    </g>
    <g transform="translate(760 305)">
      <rect width="300" height="70" rx="12" fill="#2b2418" stroke="#e5c07b"/>
      <text x="18" y="30" fill="#e5c07b" font-size="16">RECOVERY + RECORD</text>
      <text x="18" y="56" fill="#f5f7f9" font-size="18">backoff → skip / raw file</text>
    </g>
  </g>
</svg>
